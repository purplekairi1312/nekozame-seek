[package]
name = "nekozame-seek"
version = "1.0.0"
description = "A TUI for Soulseek, meant for servers and high-quality collections"
license = "GPL-3.0-or-later"
repository = "https://git.sr.ht/~purplekairi1312/nekozame-seek"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
lofty = "0.25.5"
ratatui = "0.30.2"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strsim = "0.11.1"
toml = "1.2.1"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", features = ["json"] }

[profile.release]
strip = true
lto = true
