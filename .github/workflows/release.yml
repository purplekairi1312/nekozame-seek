name: release

# on a tag (v1.0.0...): ready-made binaries in the release. on every push: it builds and
# its tests pass
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup target add ${{ matrix.target }}
      - name: Tools for the static GNU/Linux builds
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update -q && sudo apt-get install -yq musl-tools
          cargo install -q cross --locked
      - name: Tests
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nekozame-seek dist/nekozame-seek-${{ matrix.target }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
